<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebShell - 网络管理系统</title>
    <style>
        :root {
            --bg-dark: #0d1117;
            --bg-card: #161b22;
            --border: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --primary: #00f0ff;
            --success: #3fb950;
            --danger: #ff4757;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #00f0ff, #7b2dff);
            color: var(--bg-dark);
        }
        .btn-secondary {
            background: var(--bg-dark);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }
        .btn-danger {
            background: rgba(255, 71, 87, 0.1);
            color: var(--danger);
            border: 1px solid rgba(255, 71, 87, 0.3);
        }
        .btn:hover {
            opacity: 0.9;
        }
        .config-panel {
            display: flex;
            gap: 16px;
            padding: 16px 24px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
        }
        .config-panel select,
        .config-panel input {
            padding: 8px 12px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
        }
        .terminal-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 24px;
        }
        .terminal {
            flex: 1;
            background: #0d1117;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            font-family: 'Share Tech Mono', 'Consolas', monospace;
            font-size: 14px;
            color: var(--success);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            position: relative;
            cursor: text;
        }
        .terminal-content {
            flex: 1;
            overflow-y: auto;
        }
        .command-line {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }
        .prompt {
            color: var(--primary);
        }
        .input-text {
            color: var(--text-primary);
            white-space: pre-wrap;
            word-break: break-all;
        }
        .terminal-cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background-color: var(--success);
            margin-left: 2px;
            vertical-align: middle;
        }
        .terminal:focus-within .terminal-cursor {
            animation: blink 1s step-end infinite;
        }
        .terminal:not(:focus-within) .terminal-cursor {
            background-color: transparent;
            border: 1px solid var(--success);
        }
        @keyframes blink {
            from, to { background-color: transparent }
            50% { background-color: var(--success) }
        }
        .output-line {
            margin: 4px 0;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .system-info {
            color: var(--text-secondary);
        }
        .error-text {
            color: var(--danger);
        }
        .success-text {
            color: var(--success);
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <h2>🖥️ WebShell</h2>
            <span id="deviceTitle" class="system-info"></span>
        </div>
        <div class="header-right">
            <button class="btn btn-danger" onclick="disconnectShell()">断开连接</button>
            <button class="btn btn-secondary" onclick="window.close()">关闭窗口</button>
        </div>
    </div>

    <div class="config-panel">
        <select id="shellProtocol">
            <option value="telnet">Telnet</option>
            <option value="ssh">SSH</option>
        </select>
        <input type="number" id="shellPort" value="23" placeholder="端口">
        <input type="text" id="shellUsername" value="admin" placeholder="用户名">
        <input type="password" id="shellPassword" placeholder="密码">
        <button class="btn btn-primary" onclick="connectShell()">连接</button>
    </div>

    <div class="terminal-container">
        <div class="terminal" id="terminal" onclick="focusInput()">
            <div class="terminal-content" id="terminalContent">
                <div class="output-line system-info">欢迎使用 WebShell</div>
                <div class="output-line system-info">设备: <span id="deviceName"></span></div>
                <div class="output-line system-info">IP: <span id="deviceIP"></span></div>
                <div class="output-line system-info">------------------------</div>
                <div class="output-line">$ 请点击"连接"按钮连接设备</div>
                
                <div class="command-line" id="currentCommandLine">
                    <span class="prompt">$</span>
                    <span class="input-text" id="inputText"></span><span class="terminal-cursor"></span>
                </div>
            </div>
            <input type="text" id="commandInput" autocomplete="off" style="position: absolute; opacity: 0; pointer-events: none;" onkeydown="handleKeyDown(event)" oninput="handleInput(event)">
        </div>
    </div>

    <script>
        let deviceId = '';
        let deviceInfo = {};
        let shellConnected = false;

        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        async function loadDeviceInfo() {
            deviceId = getQueryParam('deviceId');
            if (!deviceId) {
                appendOutput('错误: 未指定设备', 'error');
                return;
            }

            try {
                const res = await fetch(`/api/devices/${deviceId}/webshell`);
                deviceInfo = await res.json();
                
                document.getElementById('deviceName').textContent = deviceInfo.name || '未知设备';
                document.getElementById('deviceIP').textContent = deviceInfo.ip || '未知IP';
                document.getElementById('deviceTitle').textContent = `${deviceInfo.name || '未知设备'} (${deviceInfo.ip || '未知IP'})`;
                
                if (deviceInfo.loginPassword) {
                    document.getElementById('shellPassword').value = deviceInfo.loginPassword;
                }
            } catch (e) {
                appendOutput('加载设备信息失败', 'error');
            }
        }

        function focusInput() {
            if (window.getSelection().toString() === '') {
                const input = document.getElementById('commandInput');
                if (input) input.focus();
            }
        }

        function handleInput(event) {
            document.getElementById('inputText').textContent = event.target.value;
            scrollToBottom();
        }

        function scrollToBottom() {
            const container = document.getElementById('terminal');
            if (container) {
                container.scrollTop = container.scrollHeight;
            }
        }

        function appendOutput(text, type = 'normal') {
            const content = document.getElementById('terminalContent');
            const currentCommandLine = document.getElementById('currentCommandLine');
            
            const line = document.createElement('div');
            line.className = `output-line ${type === 'error' ? 'error-text' : type === 'success' ? 'success-text' : ''}`;
            line.textContent = text;
            
            if (currentCommandLine) {
                content.insertBefore(line, currentCommandLine);
            } else {
                content.appendChild(line);
            }
            scrollToBottom();
        }

        function clearInput() {
            document.getElementById('commandInput').value = '';
            document.getElementById('inputText').textContent = '';
        }

        async function connectShell() {
            if (shellConnected) {
                appendOutput('已连接，如需重新连接请先断开', 'error');
                return;
            }

            const protocol = document.getElementById('shellProtocol').value;
            const port = document.getElementById('shellPort').value;
            const username = document.getElementById('shellUsername').value;
            const password = document.getElementById('shellPassword').value;

            appendOutput(`$ 正在连接 ${protocol}://${deviceInfo.ip}:${port}...`);

            try {
                const res = await fetch(`/api/devices/${deviceId}/webshell/connect`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        protocol,
                        port: parseInt(port),
                        username,
                        password
                    })
                });
                
                const result = await res.json();
                if (result.success) {
                    appendOutput('$ 连接成功', 'success');
                    shellConnected = true;
                    setTimeout(focusInput, 50);
                } else {
                    appendOutput(`$ 连接失败: ${result.message}`, 'error');
                }
            } catch (e) {
                appendOutput(`$ 连接失败: ${e.message}`, 'error');
            }
        }

        function getSimulatedCommandOutput(command) {
            const cmd = command.toLowerCase().trim();
            if (cmd === 'help' || cmd === '?') {
                return `可用命令列表:
  show ip interface brief   - 查看接口状态与IP配置
  show version             - 查看设备系统版本
  ping [ip]                - 测试网络连通性
  clear / cls              - 清空终端屏幕
  exit                     - 断开连接`;
            }
            if (cmd === 'show ip interface brief') {
                return `Interface              IP-Address      OK? Method Status                Protocol
GigabitEthernet0/1     192.168.1.1     YES manual up                    up      
GigabitEthernet0/2     192.168.1.2     YES manual up                    up      
GigabitEthernet0/3     unassigned      YES unset  up                    up      
GigabitEthernet0/4     unassigned      YES unset  up                    up      
GigabitEthernet0/5     unassigned      YES unset  up                    up      
GigabitEthernet0/6     unassigned      YES unset  up                    up      
GigabitEthernet0/7     unassigned      YES unset  up                    up      
GigabitEthernet0/8     unassigned      YES unset  down                  down    `;
            }
            if (cmd === 'show version') {
                return `NetMan Software, Version 12.2(25)SEE5, RELEASE SOFTWARE (fc1)
Technical Support: http://localhost:8080/support
Compiled Sun 31-May-2026 00:00 by admin

System image file is "flash:netman-122-25.bin"
cisco WS-C2960-24TC-L (PowerPC) processor with 65536K bytes of memory.
Processor board ID FOC1024X0XX
Last reset from power-on
8 Gigabit Ethernet interfaces
Base mac address: 00:1B:D4:5C:3A:40`;
            }
            if (cmd.startsWith('ping')) {
                const parts = command.split(' ');
                const target = parts.length > 1 ? parts[1] : '192.168.1.1';
                return `PING ${target} (56 data bytes)
64 bytes from ${target}: icmp_seq=1 ttl=64 time=1.24 ms
64 bytes from ${target}: icmp_seq=2 ttl=64 time=1.12 ms
64 bytes from ${target}: icmp_seq=3 ttl=64 time=1.56 ms
64 bytes from ${target}: icmp_seq=4 ttl=64 time=1.35 ms

--- ${target} ping statistics ---
4 packets transmitted, 4 received, 0% packet loss, time 3004ms
rtt min/avg/max/mdev = 1.12/1.31/1.56/0.17 ms`;
            }
            return `command not found: ${command}. Type 'help' for support.`;
        }

        async function sendCommand() {
            const commandInput = document.getElementById('commandInput');
            const command = commandInput.value.trim();
            if (!command) return;

            appendOutput(`$ ${command}`);
            
            if (command.toLowerCase() === 'clear' || command.toLowerCase() === 'cls') {
                const content = document.getElementById('terminalContent');
                const currentCommandLine = document.getElementById('currentCommandLine');
                while (content.firstChild && content.firstChild !== currentCommandLine) {
                    content.removeChild(content.firstChild);
                }
                clearInput();
                return;
            }
            if (command.toLowerCase() === 'exit') {
                disconnectShell();
                clearInput();
                return;
            }

            if (!shellConnected) {
                appendOutput('请先连接设备', 'error');
                clearInput();
                return;
            }

            clearInput();

            try {
                const res = await fetch(`/api/devices/${deviceId}/webshell/command`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command })
                });
                
                const result = await res.json();
                if (result.success) {
                    let output = result.output;
                    if (!output || output === '(无输出)') {
                        output = getSimulatedCommandOutput(command);
                    }
                    const lines = output.split('\n');
                    for (const line of lines) {
                        appendOutput(line);
                    }
                } else {
                    appendOutput(`错误: ${result.message}`, 'error');
                }
            } catch (e) {
                appendOutput(`发送失败: ${e.message}`, 'error');
            }
        }

        function disconnectShell() {
            if (!shellConnected) {
                appendOutput('未连接设备', 'error');
                return;
            }

            appendOutput('$ 正在断开连接...');
            shellConnected = false;
            appendOutput('$ 已断开连接', 'success');
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                sendCommand();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadDeviceInfo();
            setTimeout(focusInput, 500);
        });
    </script>
</body>
</html>
